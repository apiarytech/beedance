CONFIGURATION WaterTreatment_Plant

    RESOURCE MainProcessor ON Rack0_Slot2
        
        (* Task Type A: Regular Cyclic execution *)
        TASK MainCycle(INTERVAL := T#50ms, PRIORITY := 10);
        
        (* Task Type B: Event-Driven execution triggered by a specific boolean variable *)
        (* It does not have an interval; it waits for 'FaultTrigger' to transition to TRUE *)
        TASK EmergencyShutdownTask(SINGLE := FaultTrigger, PRIORITY := 1);

        (* --- INSTANTIATION & DATA PASSING --- *)
        
        (* Instantiating the same Program block twice for independent hardware assets *)
        (* You can pass initial configuration values directly into the instance declaration *)
        PROGRAM Pump_1 WITH MainCycle : PumpControl_PRG(PumpID := 1, MaxRuntime := T#24h);
        PROGRAM Pump_2 WITH MainCycle : PumpControl_PRG(PumpID := 2, MaxRuntime := T#12h);

        (* Instantiating the safety routine to trigger immediately on the hardware event *)
        PROGRAM SafetyOverride WITH EmergencyShutdownTask : Interlock_PRG;

    END_RESOURCE

END_CONFIGURATION
