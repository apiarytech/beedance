CONFIGURATION AssemblyCell

    (* Variables visible to every Resource in the configuration *)
    VAR_GLOBAL
        Cell_State : INT; 
    END_VAR

    RESOURCE Station_1 ON Control_Node_A
        
        (* Variables restricted strictly to this Resource physical space *)
        VAR_GLOBAL
            RobotReadyFeedback AT %IX2.1 : BOOL;
            CycleStartCommand   AT %QX2.1 : BOOL;
        END_VAR

        TASK ProductionTask(INTERVAL := T#10ms, PRIORITY := 2);

        (* Instantiating the Program blueprint *)
        PROGRAM StationManager WITH ProductionTask : Sequence_PRG;

    END_RESOURCE

    (* VAR_CONFIG links unlocated variables inside instances to concrete hardware maps *)
    VAR_CONFIG
        Station_1.StationManager.PhysicalSensor AT %IX0.5 : BOOL;
    END_CONFIG

END_CONFIGURATION
