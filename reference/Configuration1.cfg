CONFIGURATION PackagingLine_PLC

    (* Global variables shared across the physical configuration *)
    VAR_GLOBAL
        Line_EmergencyStop AT %IX0.0 : BOOL;
        ConveyorSpeedActual         : REAL;
    END_VAR

    (* ========================================== *)
    (* RESOURCE 1: Dedicated to High-Speed Motion *)
    (* ========================================== *)
    RESOURCE Core_Fast ON CPU_Module_1
        VAR_GLOBAL
            Axis_Position AT %MD100 : REAL;
        END_VAR

        (* Fast Task: Runs every 2 milliseconds with highest priority *)
        TASK MotionTask(INTERVAL := T#2ms, PRIORITY := 0);
        
        (* Assigning the motion control blueprint to the fast task *)
        PROGRAM ServoDrive WITH MotionTask : FastMotion_PRG;
    END_RESOURCE

    (* ========================================== *)
    (* RESOURCE 2: Dedicated to Standard Process   *)
    (* ========================================== *)
    RESOURCE Core_Standard ON CPU_Module_2
        
        (* Cyclic Task: Runs every 20 milliseconds *)
        TASK CyclicProcessTask(INTERVAL := T#20ms, PRIORITY := 5);
        
        (* Freewheeling/Continuous Task: Runs constantly in background *)
        TASK LoggingTask(PRIORITY := 20); 

        (* Allocating multiple programs onto this core *)
        PROGRAM TempControl WITH CyclicProcessTask : PID_Loop_PRG;
        PROGRAM ValveLogic   WITH CyclicProcessTask : DiscreteIO_PRG;
         PROGRAM DataLogger   WITH LoggingTask       : Historian_PRG;
    END_RESOURCE

END_CONFIGURATION
