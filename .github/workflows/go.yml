name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Fail instead of silently downloading a newer toolchain, so each matrix
  # entry really tests the Go version it names.
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go:
          - '1.27' # Minimum version. Keep in sync with the go directive in go.mod.
          - 'stable'
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

    # A module of its own, which ./... above does not reach.
    - name: Test the honeycomb connector
      working-directory: connectors/honeycomb
      run: |
        go vet ./...
        go test -v ./...

    # Also a module of its own: it needs royaljelly for the transpiled engine.
    - name: Test the embedded benchmark
      working-directory: embedded/bench
      run: |
        go vet ./...
        go run ./gen -check
        go test -v ./...

    # Also a module of its own: it needs beebread, whose OSCAT ports it
    # compares with the evaluator running the OSCAT sources.
    - name: Test the OSCAT ports against the evaluator
      working-directory: oscatdiff
      run: |
        go vet ./...
        go test -v ./...

  lint-race:
    name: Format and race detector
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Test with race detector
      run: go test -race -count=1 ./...

    - name: Test the honeycomb connector with race detector
      working-directory: connectors/honeycomb
      run: go test -race -count=1 ./...

    # The LSP parses incomplete input on every keystroke: fuzz the parser,
    # lint and the IDE's analysis briefly for hangs and panics.
    - name: Fuzz the parser, lint and IDE analysis
      run: |
        go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s ./parser
        go test -run '^$' -fuzz '^FuzzLint$' -fuzztime 30s ./analyzer
        go test -run '^$' -fuzz '^FuzzAnalyze$' -fuzztime 30s ./ide

  # The debugger in the web module (doc/web-debugger.md), under Node.js:
  # a running program must not starve the event loop.
  web:
    name: Web debugger
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Vet the js-only files
      run: GOOS=js GOARCH=wasm go vet ./wasm/...

    - name: Build the web module
      run: |
        GOOS=js GOARCH=wasm go build -o wasm/web/beedance.wasm ./wasm/cmd/beedance-wasm
        cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" wasm/web/

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Debug a program in the module under Node.js
      run: timeout 60 node wasm/node/dap.mjs wasm/web/wasm_exec.js wasm/web/beedance.wasm

  raspberry-pi:
    name: Raspberry Pi (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pi Zero and Pi 1, 32-bit ARMv6
            goarch: arm
            goarm: '6'
            artifact: beedance-linux-armv6
          - name: Pi 2 and Pi 3, 32-bit ARMv7
            goarch: arm
            goarm: '7'
            artifact: beedance-linux-armv7
          - name: Pi 3, 4 and 5, 64-bit
            goarch: arm64
            goarm: ''
            artifact: beedance-linux-arm64
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    # QEMU runs the ARM test binaries on the x86 runner.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm,arm64

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -count=1 ./...

    - name: Build the beedance command
      run: go build -o ${{ matrix.artifact }} .

    - name: Upload the beedance command
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.artifact }}

  tinygo-test:
    name: TinyGo Build Test
    runs-on: ubuntu-latest
    env:
      # TinyGo selects its own Go toolchain.
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable' # TinyGo needs a Go installation

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: '0.43.0' # Specify the TinyGo version you want to use

      # Each test runs in a goroutine, whose stack TinyGo does not grow: the
      # parser and compiler recurse deeply, and compiling the OSCAT library
      # needs more than 256 KB. A program compiled ahead of time runs on the
      # VM in 8 KB (see doc/embedded.md).
      - name: Test with TinyGo
        run: tinygo test -v -stack-size=1MB ./token ./lexer ./ast ./code ./object ./parser ./stdlib ./compiler ./vm ./evaluator

  raspberry-pi-pico:
    name: Raspberry Pi Pico (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - pico    # RP2040
          - pico-w  # RP2040 with Wi-Fi
          - pico2   # RP2350
          - pico2-w # RP2350 with Wi-Fi
    env:
      # TinyGo selects its own Go toolchain.
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable' # TinyGo needs a Go installation

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: '0.43.0'

      - name: Build the embedded VM example
        run: tinygo build -target=${{ matrix.target }} -size short -o beedance-${{ matrix.target }}.uf2 ./embedded/example/raspberrypi/

      - name: Build the hardware-in-the-loop rig
        run: tinygo build -target=${{ matrix.target }} -size short -o beedance-rig-${{ matrix.target }}.uf2 ./embedded/rig/pico/

      # Each engine on its own and all three together, as embedded/bench measures them.
      - name: Build the embedded benchmark
        working-directory: embedded/bench
        run: |
          for fw in vm go none; do tinygo build -target=${{ matrix.target }} -size short -o "$RUNNER_TEMP/bench.elf" ./fw/$fw; done
          for fw in eval all; do tinygo build -target=${{ matrix.target }} -stack-size=16KB -size short -o "$RUNNER_TEMP/bench.elf" ./fw/$fw; done

      - name: Upload the firmware
        uses: actions/upload-artifact@v4
        with:
          name: beedance-${{ matrix.target }}
          path: |
            beedance-${{ matrix.target }}.uf2
            beedance-rig-${{ matrix.target }}.uf2

  pico-emulator:
    name: Raspberry Pi Pico (emulated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the emulator image
        run: docker build -f embedded/picosim/Dockerfile -t beedance-picosim .

      - name: Start the emulator
        run: docker run -d --name picosim -p 4000:4000 beedance-picosim

      - name: Test the firmware
        run: go test -count=1 -v -tags picosim ./embedded/picosim/

      - name: Emulator log
        if: always()
        run: docker logs picosim

      # The rig, with GP2 wired to GP10 and ADC0 at 2048: its own tests,
      # then a Structured Text test hardware in the loop.
      - name: Build the rig's emulator image
        run: docker build -f embedded/picosim/Dockerfile --build-arg PKG=./embedded/rig/pico -t beedance-picosim-rig .

      - name: Start the rig
        run: docker run -d --name picosim-rig -p 4100:4000 -e UART_BACKLOG=0 -e WIRES=2:10 -e ADC=0:2048 beedance-picosim-rig

      - name: Test the rig
        run: go test -count=1 -v -tags picosimrig ./embedded/picosim/

      - name: Hardware in the loop
        run: go run . -test -io tcp://localhost:4100 -interval 20ms -engines eval,vm embedded/rig/pico/bench.st

      - name: Rig log
        if: always()
        run: docker logs picosim-rig

  esp32-emulator:
    name: ESP32 (emulated, ${{ matrix.chip }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32, esp32c3, esp32s3, esp32c6]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # TinyGo firmware on Espressif's QEMU; the C3, S3 and C6 boot through
      # ESP-IDF's bootloader. See embedded/esp32sim/README.md.
      - name: Build the emulator image
        run: docker build -f embedded/esp32sim/Dockerfile --build-arg CHIP=${{ matrix.chip }} -t beedance-esp32sim .

      - name: Start the emulator
        run: docker run -d --name esp32sim -p 4000:4000 beedance-esp32sim

      - name: Test the firmware
        run: go test -count=1 -v -tags esp32sim ./embedded/esp32sim/

      - name: Emulator log
        if: always()
        run: docker logs esp32sim
