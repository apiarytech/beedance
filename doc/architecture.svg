<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="990" viewBox="0 0 1300 990" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>beedance architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .t  { font-size: 12.5px; font-weight: 600; fill: #1f1f1f; text-anchor: middle; }
      .s  { font-size: 11px; fill: #444; text-anchor: middle; }
      .h  { font-size: 14px; font-weight: 700; fill: #1f1f1f; }
      .hs { font-size: 12px; font-weight: 400; fill: #555; }
      .g  { font-size: 11.5px; font-weight: 600; fill: #3d6fb3; }
      .gt { font-size: 11.5px; font-weight: 600; fill: #3c8a46; }
      .l  { font-size: 10.5px; fill: #333; }
      .lg { font-size: 10.5px; fill: #3c8a46; }
      .bh { fill: #eaf1fb; stroke: #3d6fb3; stroke-width: 1.5; }
      .bi { fill: #ffffff; stroke: #3d6fb3; stroke-width: 1.2; }
      .bt { fill: #eef7ee; stroke: #3c8a46; stroke-width: 1.5; }
      .dh { fill: #fff3e0; stroke: #c47a14; stroke-width: 1.5; }
      .sm { font-size: 12px; font-weight: 600; fill: #1f1f1f; text-anchor: middle; }
      .ex { fill: #ffffff; stroke: #555; stroke-width: 1.3; }
      .ln { stroke: #333; stroke-width: 1.4; fill: none; }
      .lt { stroke: #3c8a46; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1300" height="990" fill="#ffffff"/>

  <text x="20" y="32" style="font-size:20px;font-weight:700;fill:#1f1f1f">beedance · architecture</text>
  <text x="20" y="52" style="font-size:12.5px;fill:#555">IEC 61131-3 in Go: one parser for ST, IL, SFC, LD and FBD, lowered alike for three backends, and unit tests that run on all three, in the loop with a plant; natively, as WebAssembly, or on a microcontroller.</text>

  <!-- Module -->
  <rect x="230" y="64" width="860" height="836" rx="10" fill="#fbfbfb" stroke="#333" stroke-width="1.6"/>
  <text x="246" y="84" class="h">github.com/apiarytech/beedance <tspan class="hs">(standard library only)</tspan></text>

  <!-- Front end -->
  <text x="250" y="98" class="g">front end</text>
  <rect x="250" y="104" width="130" height="66" rx="5" class="bi"/>
  <text x="315" y="126" class="t">lexer · token</text>
  <text x="315" y="144" class="s">typed literals (T#5s)</text>
  <text x="315" y="159" class="s">nested comments</text>
  <rect x="400" y="104" width="150" height="66" rx="5" class="bh"/>
  <text x="475" y="126" class="t">parser</text>
  <text x="475" y="144" class="s">ST · IL · SFC · POUs</text>
  <text x="475" y="159" class="s">errors with row, column</text>
  <rect x="570" y="104" width="140" height="66" rx="5" class="bh"/>
  <text x="640" y="126" class="t">ast</text>
  <text x="640" y="144" class="s">one tree, every language</text>
  <text x="640" y="159" class="s">macros expanded</text>
  <rect x="250" y="200" width="130" height="70" rx="5" class="bi"/>
  <text x="315" y="222" class="t">plcopen</text>
  <text x="315" y="240" class="s">TC6 XML import, export</text>
  <text x="315" y="255" class="s">LD · FBD · SFC graphical</text>
  <rect x="400" y="200" width="150" height="70" rx="5" class="bi"/>
  <text x="475" y="222" class="t">diagram</text>
  <text x="475" y="240" class="s">LD and FBD → ST statements</text>
  <text x="475" y="255" class="s">SVG of LD · FBD · SFC</text>
  <path d="M380,137 H398" class="ln" marker-end="url(#a)"/>
  <path d="M550,137 H568" class="ln" marker-end="url(#a)"/>
  <path d="M380,235 H398" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M475,172 V198" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="481" y="190" class="l">text-form bodies</text>
  <path d="M315,200 V188 H360 V172" class="ln" marker-end="url(#a)"/>

  <!-- Lowering -->
  <text x="250" y="296" class="g">lowering (to plainer AST, the same for every engine)</text>
  <rect x="250" y="304" width="107" height="40" rx="5" class="bh"/>
  <text x="303.5" y="320" class="sm">edges</text>
  <text x="303.5" y="335" class="s">R_EDGE · F_EDGE</text>
  <rect x="367" y="304" width="107" height="40" rx="5" class="bh"/>
  <text x="420.5" y="320" class="sm">enables</text>
  <text x="420.5" y="335" class="s">EN · ENO</text>
  <rect x="484" y="304" width="107" height="40" rx="5" class="bh"/>
  <text x="537.5" y="320" class="sm">enums</text>
  <text x="537.5" y="335" class="s">bare enum values</text>
  <rect x="601" y="304" width="107" height="40" rx="5" class="bh"/>
  <text x="654.5" y="320" class="sm">stdcalls</text>
  <text x="654.5" y="335" class="s">named inputs</text>
  <rect x="250" y="352" width="107" height="40" rx="5" class="bh"/>
  <text x="303.5" y="368" class="sm">typedfbs</text>
  <text x="303.5" y="383" class="s">typed CTU · TON</text>
  <rect x="367" y="352" width="107" height="40" rx="5" class="bh"/>
  <text x="420.5" y="368" class="sm">sfc</text>
  <text x="420.5" y="383" class="s">SFC → ST</text>
  <rect x="484" y="352" width="107" height="40" rx="5" class="bh"/>
  <text x="537.5" y="368" class="sm">inputwrites</text>
  <text x="537.5" y="383" class="s">inputs read-only</text>
  <text x="654.5" y="368" class="s">applied by the evaluator,</text>
  <text x="654.5" y="383" class="s">compiler and transpiler</text>
  <path d="M640,170 V302" class="ln" marker-end="url(#a)"/>
  <path d="M710,324 H725 V132 H738" class="ln" marker-end="url(#a)"/>
  <path d="M725,210 H738" class="ln" marker-end="url(#a)"/>
  <path d="M725,324 V450 H738" class="ln" marker-end="url(#a)"/>

  <!-- Backends -->
  <text x="740" y="98" class="g">backends</text>
  <rect x="740" y="104" width="160" height="56" rx="5" class="bh"/>
  <text x="820" y="125" class="t">evaluator</text>
  <text x="820" y="143" class="s">simulator, debugger</text>
  <rect x="740" y="182" width="160" height="56" rx="5" class="bh"/>
  <text x="820" y="203" class="t">compiler · code</text>
  <text x="820" y="221" class="s">bytecode · variables to bind</text>
  <rect x="920" y="182" width="150" height="56" rx="5" class="bh"/>
  <text x="995" y="203" class="t">vm</text>
  <text x="995" y="221" class="s">stack machine, per scan</text>
  <rect x="920" y="262" width="150" height="56" rx="5" class="bi"/>
  <text x="995" y="283" class="t">vmconfig</text>
  <text x="995" y="301" class="s">CONFIGURATION · tasks</text>
  <rect x="920" y="342" width="150" height="56" rx="5" class="bi"/>
  <text x="995" y="363" class="t">embedded</text>
  <text x="995" y="381" class="s">VM + bytecode as Go</text>
  <rect x="740" y="422" width="160" height="56" rx="5" class="bh"/>
  <text x="820" y="443" class="t">transpiler</text>
  <text x="820" y="461" class="s">Go source on royaljelly</text>
  <path d="M900,210 H918" class="ln" marker-end="url(#a)"/>
  <path d="M995,238 V260" class="ln" marker-end="url(#a)"/>
  <path d="M820,238 V370 H918" class="ln" marker-end="url(#a)"/>

  <!-- Shared runtime -->
  <text x="250" y="516" class="g">shared runtime (evaluator and VM)</text>
  <rect x="250" y="522" width="220" height="56" rx="5" class="bi"/>
  <text x="360" y="543" class="t">object</text>
  <text x="360" y="561" class="s">values, arrays, structures, FB instances</text>
  <rect x="490" y="522" width="220" height="56" rx="5" class="bi"/>
  <text x="600" y="543" class="t">stdlib</text>
  <text x="600" y="561" class="s">standard functions, built in</text>
  <rect x="730" y="522" width="170" height="56" rx="5" class="bi"/>
  <text x="815" y="543" class="t">native</text>
  <text x="815" y="561" class="s">host function blocks</text>
  <rect x="920" y="522" width="150" height="56" rx="5" class="bi"/>
  <text x="995" y="543" class="t">connectors/honeycomb</text>
  <text x="995" y="561" class="s">variables ↔ tags</text>

  <!-- Testing in the loop -->
  <text x="250" y="612" class="gt">testing in the loop (PROGRAM TEST_...)</text>
  <rect x="250" y="618" width="240" height="56" rx="5" class="bt"/>
  <text x="370" y="639" class="t">sil</text>
  <text x="370" y="657" class="s">eval · vm · go · wasm, compared per scan</text>
  <rect x="510" y="618" width="150" height="56" rx="5" class="bi"/>
  <text x="585" y="639" class="t">watch</text>
  <text x="585" y="657" class="s">values by dotted name</text>
  <rect x="680" y="618" width="170" height="56" rx="5" class="bt"/>
  <text x="765" y="639" class="t">oscatdiff</text>
  <text x="765" y="657" class="s">OSCAT ports vs the evaluator</text>
  <rect x="870" y="618" width="200" height="56" rx="5" class="bt"/>
  <text x="970" y="639" class="t">embedded/rig/pico</text>
  <text x="970" y="657" class="s">HIL rig, TinyGo firmware</text>
  <path d="M820,478 V498 H480 V616" class="lt" marker-end="url(#a)"/>
  <text x="560" y="493" class="lg">tests run on each engine</text>
  <path d="M490,646 H508" class="ln" marker-end="url(#a)"/>
  <path d="M370,676 V690 H970 V676" class="lt" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="530" y="705" class="lg">sil.IO · the rig protocol, JSON lines over TCP or serial</text>

  <!-- Microcontrollers -->
  <text x="250" y="726" class="g">embedded/ on microcontrollers (TinyGo firmware)</text>
  <rect x="250" y="732" width="156" height="56" rx="5" class="bi"/>
  <text x="328" y="753" class="t">example/raspberrypi</text>
  <text x="328" y="771" class="s">VM firmware: Pico · ESP32</text>
  <rect x="416" y="732" width="156" height="56" rx="5" class="bt"/>
  <text x="494" y="753" class="t">esp32hw · plc</text>
  <text x="494" y="771" class="s">a PLC on a real ESP32</text>
  <rect x="582" y="732" width="156" height="56" rx="5" class="bt"/>
  <text x="660" y="753" class="t">picosim</text>
  <text x="660" y="771" class="s">emulated Pico in Docker</text>
  <rect x="748" y="732" width="156" height="56" rx="5" class="bt"/>
  <text x="826" y="753" class="t">esp32sim</text>
  <text x="826" y="771" class="s">emulated ESP32s in QEMU</text>
  <rect x="914" y="732" width="156" height="56" rx="5" class="bi"/>
  <text x="992" y="753" class="t">bench</text>
  <text x="992" y="771" class="s">speed · size · profile</text>

  <!-- Tools -->
  <text x="250" y="816" class="g">tools</text>
  <rect x="250" y="822" width="130" height="56" rx="5" class="bi"/>
  <text x="315" y="843" class="t">repl</text>
  <text x="315" y="861" class="s">interactive evaluator</text>
  <rect x="393" y="822" width="300" height="56" rx="5" class="bi"/>
  <text x="543" y="843" class="t">beedance command</text>
  <text x="543" y="861" class="s">-iec · -to-xml · -from-xml · -go · -test -io</text>
  <rect x="706" y="822" width="150" height="56" rx="5" class="bi"/>
  <text x="781" y="843" class="t">ide</text>
  <text x="781" y="861" class="s">the language half of LSP</text>
  <rect x="870" y="822" width="200" height="56" rx="5" class="bi"/>
  <text x="970" y="843" class="t">wasm · cmd/beedance-wasm</text>
  <text x="970" y="861" class="s">the toolchain as WebAssembly</text>

  <!-- External, left -->
  <rect x="20" y="104" width="190" height="66" rx="6" class="ex"/>
  <text x="115" y="126" class="t">Source text</text>
  <text x="115" y="144" class="s">ST · IL · SFC, and LD and FBD</text>
  <text x="115" y="159" class="s">(LD ... END_LD, FBD ... END_FBD)</text>
  <path d="M212,137 H248" class="ln" marker-end="url(#a)"/>
  <rect x="20" y="200" width="190" height="70" rx="6" class="ex"/>
  <text x="115" y="222" class="t">PLCopen XML (TC6)</text>
  <text x="115" y="240" class="s">from other IEC 61131-3 tools</text>
  <text x="115" y="255" class="s">text and graphical bodies</text>
  <path d="M212,235 H248" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- External, right -->
  <rect x="1110" y="100" width="180" height="64" rx="6" class="dh"/>
  <text x="1200" y="122" class="t">beehive engineering</text>
  <text x="1200" y="140" class="s">check, simulate, SIL tests</text>
  <text x="1200" y="155" class="s">beehive-lsp · previews</text>
  <path d="M900,132 H1108" class="ln" marker-end="url(#a)"/>
  <rect x="1110" y="180" width="180" height="60" rx="6" class="dh"/>
  <text x="1200" y="201" class="t">beehive logic</text>
  <text x="1200" y="219" class="s">programs · HIL tests on tags</text>
  <path d="M1070,210 H1108" class="ln" marker-end="url(#a)"/>
  <rect x="1110" y="340" width="180" height="60" rx="6" class="ex"/>
  <text x="1200" y="361" class="t">TinyGo</text>
  <text x="1200" y="379" class="s">microcontroller firmware</text>
  <path d="M1070,370 H1108" class="ln" marker-end="url(#a)"/>
  <rect x="1110" y="420" width="180" height="60" rx="6" class="dh"/>
  <text x="1200" y="441" class="t">royaljelly + beebread</text>
  <text x="1200" y="459" class="s">native programs, OSCAT</text>
  <path d="M900,450 H1108" class="ln" marker-end="url(#a)"/>
  <rect x="1110" y="520" width="180" height="60" rx="6" class="dh"/>
  <text x="1200" y="541" class="t">honeycomb</text>
  <text x="1200" y="559" class="s">tag database</text>
  <path d="M1070,550 H1108" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="1110" y="612" width="180" height="68" rx="6" class="ex"/>
  <text x="1200" y="634" class="t">The plant</text>
  <text x="1200" y="652" class="s">a Pico on the bench, a rig</text>
  <text x="1200" y="667" class="s">in any language, a model in Go</text>
  <path d="M1070,646 H1108" class="lt" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="1110" y="728" width="180" height="64" rx="6" class="ex"/>
  <text x="1200" y="750" class="t">Boards and emulators</text>
  <text x="1200" y="768" class="s">Pico · ESP32 on a serial port</text>
  <text x="1200" y="783" class="s">or in Docker, for CI</text>
  <path d="M1070,760 H1108" class="lt" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="1110" y="816" width="180" height="72" rx="6" class="ex"/>
  <text x="1200" y="838" class="t">Browser · WASI runtime</text>
  <text x="1200" y="856" class="s">the playground page</text>
  <text x="1200" y="871" class="s">SIL tests in Docker, for CI</text>
  <path d="M1070,850 H1108" class="ln" marker-end="url(#a)"/>

  <!-- Legend -->
  <g transform="translate(230,922)">
    <rect x="0" y="0" width="16" height="12" class="bh"/>
    <text x="22" y="11" style="font-size:11.5px;fill:#333">beedance, the pipeline</text>
    <rect x="160" y="0" width="16" height="12" class="bt"/>
    <text x="182" y="11" style="font-size:11.5px;fill:#333">beedance, testing</text>
    <rect x="290" y="0" width="16" height="12" class="bi"/>
    <text x="312" y="11" style="font-size:11.5px;fill:#333">beedance, around it</text>
    <rect x="440" y="0" width="16" height="12" class="dh"/>
    <text x="462" y="11" style="font-size:11.5px;fill:#333">other apiarytech projects</text>
    <rect x="620" y="0" width="16" height="12" class="ex"/>
    <text x="642" y="11" style="font-size:11.5px;fill:#333">outside</text>
    <path d="M706,6 H746" class="ln" marker-end="url(#a)"/>
    <text x="754" y="11" style="font-size:11.5px;fill:#333">source, tree, code</text>
    <text x="0" y="36" style="font-size:11.5px;fill:#555">The compiler and the VM do not import the evaluator (vmconfig does). Modules of their own: connectors/honeycomb, oscatdiff, embedded/bench. Details: doc/*.md, wasm/README.md.</text>
  </g>
</svg>
